<div class="flex space-x-4 mt-5">
  <div class="w-52">
    <ul>
      @for (category of categories(); track $index) {
        <li>
          <a href="">{{ category.name }}</a>
        </li>
      }
    </ul>
  </div>
  <div class="grid grid-cols-4 gap-3 w-full">
    @for (product of products(); track $index) {
      <app-product
        [product]="product"
        (addToCart)="addToCart($event)"
      />
    }
  </div>
</div>
